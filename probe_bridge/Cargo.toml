[package]
name = "motor-bench-probe"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
probe-rs = "=0.31.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
# Keep CMSIS-DAP v1 through the Windows HID API without building a C USB shim.
hidapi = { version = "2.6.7", default-features = false, features = ["windows-native"] }
